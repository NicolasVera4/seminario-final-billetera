services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qash
      POSTGRES_PASSWORD: qash
      POSTGRES_DB: qash
    ports:
      - "5432:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qash"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: qash
      POSTGRES_PASSWORD: qash
      POSTGRES_DB: qash_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qash"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - datos_chroma:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - datos_ollama:/root/.ollama

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://qash:qash@db:5432/qash
      DATABASE_URL_TEST: postgresql+psycopg://qash:qash@db_test:5432/qash_test
      OLLAMA_URL: http://ollama:11434
      CHROMA_URL: http://chroma:8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - datos_archivos:/datos/archivos
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  datos_db:
  datos_chroma:
  datos_ollama:
  datos_archivos:
