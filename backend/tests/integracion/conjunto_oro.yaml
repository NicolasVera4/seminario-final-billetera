# Conjunto de oro para HU-03 (interpretacion con el LLM real).
# Cada entrada: mensaje tal como lo escribiria un usuario + lo que se espera
# que interprete el modelo. fecha_hoy simula la fecha del dia para CA2.
# Fase 2 corre solo las primeras 10; el conjunto completo (~30) se arma en la Fase 12.

- texto: "gasté 15000 en el súper con débito"
  fecha_hoy: "2026-10-31"
  esperado:
    intencion: REGISTRO
    monto: 15000
    tipo: EGRESO
    medio_pago: "Débito"
    categoria: "Supermercado"

