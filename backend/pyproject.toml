[project]
name = "qash-backend"
version = "0.1.0"
description = "Backend de Qash — asistente de finanzas personales"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "groq>=0.11",
    "pytesseract>=0.3",
    "pdf2image>=1.17",
    "pdfplumber>=0.11",
    "Pillow>=10.0",
    "chromadb>=0.5",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integracion: tests que llaman a servicios externos reales (Groq, Ollama, etc.)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
